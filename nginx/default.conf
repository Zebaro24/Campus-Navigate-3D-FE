server {
    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare answers plain http too and says so in CF-Visitor (the proxy in
    # front of this container rewrites X-Forwarded-Proto, so that one is useless).
    # Without this redirect http://campus.zebaro.dev/ was a second copy of the site.
    if ($http_cf_visitor ~ '"scheme":"http"') {
        return 301 https://$host$request_uri;
    }

    # Real files first (robots.txt, sitemap.xml, og.jpg); a missing file with an
    # extension is a 404, not the app — crawlers must not get HTML for robots.txt.
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
